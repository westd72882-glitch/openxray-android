name: Build APK and Release

# Положите этот файл в .github/workflows/ вашего форка.
# Он сам применит патчи, соберёт APK и выложит его в Releases.

on:
  push:
    paths: ['.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Путь по умолчанию (Download/Stalker), кнопка поддержки и русский
      # интерфейс теперь лежат прямо в исходниках лаунчера
      # (android/app/src/main/...), отдельный патч больше не нужен.

      - name: Fix engine UI crash (zero-size vertex lock in CUIFrameLineWnd)
        run: |
          python3 - <<'PYEOF'
          p='src/xrUICore/Windows/UIFrameLineWnd.cpp'
          s=open(p,encoding='utf-8').read()
          old='StartPrimitive(6 * total_tiles, IUIRender::ptTriList, UI().m_currentPointType);'
          new='StartPrimitive(6 * (total_tiles ? total_tiles : 1u), IUIRender::ptTriList, UI().m_currentPointType);'
          if new in s:
              print('already patched')
          else:
              assert s.count(old)==1, 'pattern not found'
              open(p,'w',encoding='utf-8').write(s.replace(old,new))
              print('patched')
          PYEOF
          grep -n 'total_tiles ? total_tiles' src/xrUICore/Windows/UIFrameLineWnd.cpp

      - name: Fix GameSpy for Android (no pthread_cancel in bionic)
        run: |
          F=Externals/GameSpy/src/GameSpy/common/linux/gsThreadLinux.c
          if ! grep -q 'OXR_ANDROID_NO_PTHREAD_CANCEL' "$F"; then
            sed -i '0,/#include <pthread.h>/s//#include <pthread.h>\n#ifdef __ANDROID__\n#define OXR_ANDROID_NO_PTHREAD_CANCEL\n#define pthread_cancel(t) 0\n#endif/' "$F"
          fi
          grep -n -A3 'OXR_ANDROID_NO_PTHREAD_CANCEL' "$F"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Restore signing key cache
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.android/openxray-release.jks
          key: openxray-signing-key-v1

      - name: Create signing key (first run only)
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/openxray-release.jks \
            -storetype JKS -storepass openxray123 -alias openxray -keypass openxray123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OpenXRay Android, OU=Dev, O=OpenXRay, L=Moscow, C=RU"

      - name: Build release APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon \
            -POXRAY_KEYSTORE="$HOME/.android/openxray-release.jks" \
            -POXRAY_KEYSTORE_PASS=openxray123 \
            -POXRAY_KEY_ALIAS=openxray \
            -POXRAY_KEY_PASS=openxray123

      - name: Collect and verify APK
        run: |
          mkdir -p out
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)"
          echo "APK: $APK"
          APKSIGNER="$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" out/OpenXRay-Android.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/OpenXRay-Android.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "OpenXRay Android $TAG" \
            --notes "Файлы игры не включены. Положите оригинальные файлы S.T.A.L.K.E.R. в Download/Stalker (папки soc / cs / cop)."
