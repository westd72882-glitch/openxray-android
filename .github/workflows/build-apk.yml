name: Build APK and Release

# Положите этот файл в .github/workflows/ вашего форка.
# Он сам применит патчи, соберёт APK и выложит его в Releases.

on:
  push:
    paths: ['.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply patches (Download/Stalker, support button)
        run: |
          cat > /tmp/patch.py <<'PYEOF'
          import sys,os
          if 'btn_support_dev' in open('android/app/src/main/res/layout/activity_launcher.xml',encoding='utf-8').read():
              print('already patched'); sys.exit(0)
          A='android/app/src/main/'
          p=A+'java/org/openxray/LauncherActivity.java'
          s=open(p,encoding='utf-8').read()
          old='new File(Environment.getExternalStorageDirectory(), "OpenXRay").getAbsolutePath();\n        mEditGamePath.setText(mPrefs.getString("game_path", defaultPath));'
          assert old in s
          s=s.replace(old,'new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "Stalker").getAbsolutePath();\n        mEditGamePath.setText(mPrefs.getString("game_path", defaultPath));')
          old='        mBtnStartNewGame.setOnClickListener(v -> launchGame(true));'
          assert old in s
          s=s.replace(old,'''        View btnSupport = findViewById(R.id.btn_support_dev);
                  if (btnSupport != null) {
                      btnSupport.setOnClickListener(v -> {
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://boosty.to/openxray")));
                          } catch (Exception ignored) { }
                      });
                  }
                  File defDir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "Stalker");
                  if (!defDir.exists()) defDir.mkdirs();
          '''+old,1)
          open(p,'w',encoding='utf-8').write(s)
          p=A+'res/layout/activity_launcher.xml'
          s=open(p,encoding='utf-8').read()
          btn='''<Button
                                  android:id="@+id/btn_support_dev"
                                  android:layout_width="match_parent"
                                  android:layout_height="40dp"
                                  android:layout_marginTop="8dp"
                                  android:background="@drawable/btn_launch"
                                  android:text="♥ ПОДДЕРЖАТЬ РАЗРАБОТЧИКА"
                                  android:textColor="#000000"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="6dp"
                                  android:text="Оригинальные файлы игры (gamedata.db*, папка soc/cs/cop) положите в Download/Stalker. Игра не входит в приложение."
                                  android:textColor="@color/text_muted"
                                  android:textSize="11sp" />
                          '''
          i=s.index('«Start New Game» launches'); j=s.index('</LinearLayout>',i)
          s=s[:j]+btn+s[j:]
          open(p,'w',encoding='utf-8').write(s)
          print("patched")
          PYEOF
          python3 /tmp/patch.py

      - name: Fix GameSpy for Android (no pthread_cancel in bionic)
        run: |
          F=Externals/GameSpy/src/GameSpy/common/linux/gsThreadLinux.c
          if ! grep -q 'OXR_ANDROID_NO_PTHREAD_CANCEL' "$F"; then
            sed -i '0,/#include <pthread.h>/s//#include <pthread.h>\n#ifdef __ANDROID__\n#define OXR_ANDROID_NO_PTHREAD_CANCEL\n#define pthread_cancel(t) 0\n#endif/' "$F"
          fi
          grep -n -A3 'OXR_ANDROID_NO_PTHREAD_CANCEL' "$F"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Restore signing key cache
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.android/openxray-release.jks
          key: openxray-signing-key-v1

      - name: Create signing key (first run only)
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/openxray-release.jks \
            -storetype JKS -storepass openxray123 -alias openxray -keypass openxray123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OpenXRay Android, OU=Dev, O=OpenXRay, L=Moscow, C=RU"

      - name: Build release APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon \
            -POXRAY_KEYSTORE="$HOME/.android/openxray-release.jks" \
            -POXRAY_KEYSTORE_PASS=openxray123 \
            -POXRAY_KEY_ALIAS=openxray \
            -POXRAY_KEY_PASS=openxray123

      - name: Collect and verify APK
        run: |
          mkdir -p out
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)"
          echo "APK: $APK"
          APKSIGNER="$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" out/OpenXRay-Android.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/OpenXRay-Android.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "OpenXRay Android $TAG" \
            --notes "Файлы игры не включены. Положите оригинальные файлы S.T.A.L.K.E.R. в Download/Stalker (папки soc / cs / cop)."
